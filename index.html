
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Hunt Elite 3D</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101b14;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  height: 65px;
  background: #14251a;
  border-bottom: 2px solid #c9a64b;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: relative;
  z-index: 5;
}

h1 {
  color: #e4c46b;
  font-size: 20px;
}

.stats {
  display: flex;
  gap: 18px;
  font-weight: bold;
}

.stats span { color: #e4c46b; }

#game {
  width: 100%;
  height: calc(100vh - 65px);
  position: relative;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: none;
}

/* Gold aiming crosshair */
#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 34px;
  height: 34px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 4;
  display: none;
  filter: drop-shadow(0 0 3px black);
}

#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: #f1d16d;
  border: 1px solid #30240b;
}

#crosshair::before {
  width: 2px;
  height: 34px;
  left: 16px;
  top: 0;
}

#crosshair::after {
  width: 34px;
  height: 2px;
  left: 0;
  top: 16px;
}

#crosshair .center {
  position: absolute;
  width: 6px;
  height: 6px;
  border: 1px solid #30240b;
  background: #f1d16d;
  border-radius: 50%;
  left: 14px;
  top: 14px;
}

#overlay {
  position: fixed;
  inset: 65px 0 0;
  background: #07120bcc;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 6;
}

.panel {
  background: #182d20;
  border: 1px solid #c9a64b;
  border-radius: 15px;
  padding: 30px;
  width: min(420px, 90%);
}

.panel h2 { color: #e4c46b; }

button {
  background: #c9a64b;
  border: 0;
  border-radius: 7px;
  padding: 14px 28px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#message {
  color: #e4c46b;
  margin-top: 15px;
  min-height: 20px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<header>
  <h1>🦆 DUCK HUNT ELITE</h1>
  <div class="stats">
    <div>SCORE: <span id="score">0</span></div>
    <div>TIME: <span id="time">60</span></div>
    <div>ROUND: <span id="round">1</span></div>
  </div>
</header>

<div id="game"></div>

<div id="crosshair"><div class="center"></div></div>

<div id="overlay">
  <div class="panel">
    <h2 id="heading">DUCK HUNT ELITE</h2>
    <p id="description">Welcome to the marsh.</p>
    <button id="start">START GAME</button>
    <div id="message">18 duck and goose species available</div>
  </div>
</div>

<script type="module">

import * as THREE from 'three';

// ------------------------------------
// SETUP
// ------------------------------------

const root = document.querySelector('#game');
const overlay = document.querySelector('#overlay');
const crosshair = document.querySelector('#crosshair');
const startButton = document.querySelector('#start');
const message = document.querySelector('#message');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb9b6);
scene.fog = new THREE.Fog(0x9bb9b6, 35, 110);

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth / (innerHeight - 65),
  0.1,
  200
);

camera.position.set(0, 5, 17);
camera.lookAt(0, 4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight - 65);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

// ------------------------------------
// LIGHTING
// ------------------------------------

scene.add(
  new THREE.HemisphereLight(0xe4f3ff, 0x59613b, 2)
);

const sun = new THREE.DirectionalLight(0xffe2ad, 3);
sun.position.set(-15, 25, 12);
sun.castShadow = true;
scene.add(sun);

// ------------------------------------
// MARSH
// ------------------------------------

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({
    color: 0x65734b,
    roughness: 1
  })
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.2;
ground.receiveShadow = true;
scene.add(ground);

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({
    color: 0x426e76,
    roughness: 0.25,
    metalness: 0.2
  })
);

water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.03, -5);
scene.add(water);

// Reeds
for (let i = 0; i < 100; i++) {
  const reed = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.025, 0.055, 2 + Math.random() * 2, 6
    ),
    new THREE.MeshStandardMaterial({ color: 0x687d40 })
  );

  reed.position.set(
    (Math.random() - 0.5) * 70,
    1,
    -12 - Math.random() * 30
  );

  scene.add(reed);
}

// Trees
for (let i = 0; i < 12; i++) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.45, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x55402b })
  );

  trunk.position.y = 2;
  tree.add(trunk);

  for (let j = 0; j < 5; j++) {
    const leaves = new THREE.Mesh(
      new THREE.SphereGeometry(2, 10, 8),
      new THREE.MeshStandardMaterial({ color: 0x365c3c })
    );

    leaves.position.set(
      (Math.random() - 0.5) * 2,
      4 + j * 0.3,
      (Math.random() - 0.5) * 2
    );

    tree.add(leaves);
  }

  tree.position.set(
    (Math.random() - 0.5) * 65,
    0,
    -25 - Math.random() * 20
  );

  scene.add(tree);
}

// ------------------------------------
// SPECIES COLLECTION
// ------------------------------------

const species = [
  { name: 'Mallard', body: 0x765437, head: 0x14613b, bill: 0xe5aa28, wing: 0x54402e },
  { name: 'Northern Pintail', body: 0x967e61, head: 0x292d28, bill: 0x30302b, wing: 0x8a8172 },
  { name: 'Green-winged Teal', body: 0x92765c, head: 0x14513a, bill: 0x292929, wing: 0x315b4b },
  { name: 'Blue-winged Teal', body: 0x92765c, head: 0x4b5149, bill: 0x292929, wing: 0x557f9d },
  { name: 'Northern Shoveler', body: 0x9b815d, head: 0x176044, bill: 0x292929, wing: 0x567b91 },
  { name: 'Gadwall', body: 0x898477, head: 0x6e5949, bill: 0x333333, wing: 0x8c918c },
  { name: 'American Wigeon', body: 0x967c61, head: 0x6b403b, bill: 0x303030, wing: 0x9d9b91 },
  { name: 'Cinnamon Teal', body: 0x9a4e2f, head: 0x9a4e2f, bill: 0x292929, wing: 0x78452e },
  { name: 'Canvasback', body: 0x9d826c, head: 0x8c3029, bill: 0x292929, wing: 0x8e8a80 },
  { name: 'Redhead', body: 0x98785e, head: 0x9a4931, bill: 0x303030, wing: 0x77716b },
  { name: 'Lesser Scaup', body: 0x44464a, head: 0x20242b, bill: 0x343c43, wing: 0x55565a },
  { name: 'Ring-necked Duck', body: 0x25282b, head: 0x15191b, bill: 0x555d58, wing: 0x383b3d },
  { name: 'Bufflehead', body: 0x252b32, head: 0x202b39, bill: 0x303030, wing: 0xf0eee7 },
  { name: 'Common Goldeneye', body: 0xeee8d7, head: 0x20272e, bill: 0x343434, wing: 0xeee8d7 },
  { name: 'Snow Goose', body: 0xf0eee7, head: 0xf0eee7, bill: 0xb84b32, wing: 0xf0eee7 },
  { name: 'Canada Goose', body: 0x51483d, head: 0x202522, bill: 0x252525, wing: 0x4c453d },
  { name: 'Greater White-fronted Goose', body: 0x777064, head: 0x665d51, bill: 0xd27b38, wing: 0x65594c },
  { name: "Ross's Goose", body: 0xf3eee2, head: 0xf3eee2, bill: 0xd66c50, wing: 0xf3eee2 }
];

// ------------------------------------
// CREATE 3D BIRD
// ------------------------------------

function createBird(type) {
  const bird = new THREE.Group();

  const bodyMaterial = new THREE.MeshStandardMaterial({
    color: type.body,
    roughness: 0.85
  });

  const headMaterial = new THREE.MeshStandardMaterial({
    color: type.head,
    roughness: 0.8
  });

  const wingMaterial = new THREE.MeshStandardMaterial({
    color: type.wing,
    roughness: 0.85
  });

  const billMaterial = new THREE.MeshStandardMaterial({
    color: type.bill,
    roughness: 0.7
  });

  // Body
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.8, 24, 16),
    bodyMaterial
  );

  body.scale.set(1.3, 0.72, 0.75);
  bird.add(body);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.38, 20, 16),
    headMaterial
  );

  head.position.set(0.82, 0.43, 0);
  bird.add(head);

  // Beak
  const bill = new THREE.Mesh(
    new THREE.ConeGeometry(0.15, 0.48, 8),
    billMaterial
  );

  bill.rotation.z = -Math.PI / 2;
  bill.position.set(1.2, 0.32, 0);
  bird.add(bill);

  // Eyes
  const eyeMaterial = new THREE.MeshStandardMaterial({
    color: 0x080808
  });

  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.045, 10, 10),
      eyeMaterial
    );

    eye.position.set(0.94, 0.49, side * 0.31);
    bird.add(eye);
  }

  // Tail
  const tail = new THREE.Mesh(
    new THREE.ConeGeometry(0.23, 0.6, 8),
    bodyMaterial
  );

  tail.rotation.z = Math.PI / 2;
  tail.position.set(-1.05, 0.18, 0);
  bird.add(tail);

  // Animated wings
  const wings = [];

  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();

    pivot.position.set(-0.05, 0.2, side * 0.35);

    const wing = new THREE.Mesh(
      new THREE.SphereGeometry(0.7, 16, 12),
      wingMaterial
    );

    wing.scale.set(0.9, 0.13, 0.55);
    wing.position.set(-0.05, 0, side * 0.28);

    pivot.add(wing);
    bird.add(pivot);
    wings.push({ pivot, side });
  }

  bird.userData.wings = wings;
  bird.userData.phase = Math.random() * Math.PI * 2;
  bird.userData.species = type.name;

  bird.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
  });

  return bird;
}

// ------------------------------------
// GAME VARIABLES
// ------------------------------------

const clock = new THREE.Clock();
const ducks = [];

let score = 0;
let time = 60;
let round = 1;
let playing = false;
let timer = null;
let spawnCount = 0;

// ------------------------------------
// SPAWN BIRD
// ------------------------------------

function spawnDuck() {
  if (!playing) return;

  const type = species[Math.floor(Math.random() * species.length)];
  const duck = createBird(type);

  const direction = Math.random() < 0.5 ? 1 : -1;

  duck.position.set(
    direction === 1 ? -24 : 24,
    4 + Math.random() * 6,
    -4 - Math.random() * 7
  );

  duck.rotation.y = direction === 1 ? 0 : Math.PI;

  duck.userData.direction = direction;
  duck.userData.speed = 4 + Math.random() * 3;
  duck.userData.phase = Math.random() * 6;

  scene.add(duck);
  ducks.push(duck);
  spawnCount++;

  message.textContent = 'Flying: ' + type.name;
}

// ------------------------------------
// UPDATE BIRDS AND FLAPPING WINGS
// ------------------------------------

function updateDucks(delta) {
  const elapsed = clock.elapsedTime;

  for (let i = ducks.length - 1; i >= 0; i--) {
    const duck = ducks[i];

    duck.position.x +=
      duck.userData.direction * duck.userData.speed * delta;

    duck.position.y =
      duck.userData.baseY ||
      duck.position.y + Math.sin(elapsed * 2 + duck.userData.phase) * delta * 0.5;

    // Wing flapping animation
    const flap = Math.sin(elapsed * 12 + duck.userData.phase) * 0.85;

    duck.userData.wings.forEach(wing => {
      wing.pivot.rotation.x = flap * wing.side;
    });

    // Gentle flight movement
    duck.rotation.z =
      Math.sin(elapsed * 2 + duck.userData.phase) * 0.035;

    if (Math.abs(duck.position.x) > 32) {
      scene.remove(duck);
      ducks.splice(i, 1);
    }
  }
}

// ------------------------------------
// UPDATE SCORE
// ------------------------------------

function updateUI() {
  document.querySelector('#score').textContent = score;
  document.querySelector('#time').textContent = time;
  document.querySelector('#round').textContent = round;
}

// ------------------------------------
// START GAME
// ------------------------------------

function startGame() {
  clearInterval(timer);

  score = 0;
  time = 60;
  round = 1;
  playing = true;

  ducks.forEach(duck => scene.remove(duck));
  ducks.length = 0;

  for (let i = 0; i < 4; i++) {
    spawnDuck();
  }

  updateUI();

  overlay.style.display = 'none';
  crosshair.style.display = 'block';

  timer = setInterval(() => {
    if (!playing) return;

    time--;

    if (time <= 0) {
      endGame();
    }

    updateUI();
  }, 1000);
}

startButton.addEventListener('click', startGame);

// ------------------------------------
// END GAME
// ------------------------------------

function endGame() {
  playing = false;
  clearInterval(timer);

  overlay.style.display = 'flex';
  crosshair.style.display = 'none';

  document.querySelector('#heading').textContent = 'ROUND COMPLETE';
  document.querySelector('#description').textContent =
    'Final score: ' + score;

  startButton.textContent = 'PLAY AGAIN';
  message.textContent = 'Great flying!';
}

// ------------------------------------
// CROSSHAIR TRACKING
// ------------------------------------

renderer.domElement.addEventListener('pointermove', event => {
  crosshair.style.left = event.clientX + 'px';
  crosshair.style.top = event.clientY + 'px';
});

// ------------------------------------
// CLICK TO TAG A BIRD
// ------------------------------------

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown', event => {
  if (!playing) return;

  const rect = renderer.domElement.getBoundingClientRect();

  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(ducks, true);

  if (hits.length) {
    let obj = hits[0].object;

    while (obj.parent && !ducks.includes(obj)) {
      obj = obj.parent;
    }

    if (ducks.includes(obj)) {
      const speciesName = obj.userData.species;

      scene.remove(obj);
      ducks.splice(ducks.indexOf(obj), 1);

      score += 10;

      if (score >= round * 150) {
        round++;
      }

      updateUI();
      message.textContent = '+10 POINTS — ' + speciesName;

      spawnDuck();
    }
  }
});

// ------------------------------------
// ANIMATION LOOP
// ------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  if (playing) {
    updateDucks(delta);

    if (ducks.length < 5 && Math.random() < delta * 0.5) {
      spawnDuck();
    }
  }

  renderer.render(scene, camera);
}

animate();

// ------------------------------------
// RESIZE
// ------------------------------------

addEventListener('resize', () => {
  camera.aspect = innerWidth / (innerHeight - 65);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight - 65);
});

</script>
</body>
</html>
