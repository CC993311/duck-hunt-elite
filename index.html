
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck Hunt Elite 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101a13;color:white;font-family:Arial,sans-serif;overflow:hidden}
header{height:66px;background:#14251a;border-bottom:2px solid #c9a64b;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
h1{font-size:22px;color:#e4c46d;letter-spacing:2px;margin:0}
.stats{display:flex;gap:20px;font-weight:bold}
.stats span{color:#e4c46d}
#game{width:100%;height:calc(100vh - 66px);display:block;cursor:crosshair}
#overlay{position:fixed;inset:66px 0 0;background:rgba(5,15,9,.55);display:flex;align-items:center;justify-content:center;text-align:center}
.panel{background:rgba(16,31,20,.94);border:1px solid #c9a64b;border-radius:15px;padding:32px;width:min(440px,90%)}
.panel h2{color:#e4c46b;font-size:30px;margin:0 0 12px}
button{background:#c9a64b;border:0;border-radius:7px;padding:14px 30px;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#e8d18b}
#message{color:#e4c46b;margin-top:14px;min-height:22px}
.hint{color:#bdc7bb;font-size:13px}
@media(max-width:600px){header{padding:0 10px}h1{font-size:16px}.stats{gap:8px;font-size:12px}}
</style>
</head>
<body>
<header>
<h1>🦆 DUCK HUNT ELITE 3D</h1>
<div class="stats">
<div>SCORE: <span id="score">0</span></div>
<div>TIME: <span id="time">60</span></div>
<div>ROUND: <span id="round">1</span></div>
</div>
</header>
<canvas id="game"></canvas>
<div id="overlay">
<div class="panel">
<h2>DUCK HUNT ELITE</h2>
<p>Welcome to the marsh.</p>
<p class="hint">A new 3D hunting arcade experience.</p>
<button id="start">START GAME</button>
<div id="message">Click START to begin</div>
</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const canvas=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ab9b4);
scene.fog=new THREE.Fog(0x9ab9b4,35,110);

const camera=new THREE.PerspectiveCamera(65,innerWidth/(innerHeight-66),.1,200);
camera.position.set(0,4,14);
camera.lookAt(0,3,0);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight-66);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xd9edff,0x53613a,2));

const sun=new THREE.DirectionalLight(0xffe3ae,3);
sun.position.set(-15,25,12);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({color:0x596a3d,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.1;
ground.receiveShadow=true;
scene.add(ground);

const water=new THREE.Mesh(
new THREE.PlaneGeometry(100,100,50,50),
new THREE.MeshStandardMaterial({color:0x416e72,roughness:.25,metalness:.25})
);
water.rotation.x=-Math.PI/2;
water.position.set(0,.05,-5);
scene.add(water);

const clock=new THREE.Clock();
const ducks=[];
const reeds=[];
let score=0,time=60,round=1,playing=false;
let timer=null;

function makeReed(x,z){
const group=new THREE.Group();
const stem=new THREE.Mesh(
new THREE.CylinderGeometry(.035,.06,2+Math.random()*2,6),
new THREE.MeshStandardMaterial({color:0x718044})
);
stem.position.y=1;
group.add(stem);
group.position.set(x,0,z);
scene.add(group);
reeds.push(group);
}

for(let i=0;i<100;i++){
makeReed((Math.random()-.5)*75,-10-Math.random()*35);
}

function makeTree(x,z){
const group=new THREE.Group();
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.35,.5,5,8),
new THREE.MeshStandardMaterial({color:0x51402a})
);
trunk.position.y=2.5;
trunk.castShadow=true;
group.add(trunk);
for(let i=0;i<5;i++){
const leaves=new THREE.Mesh(
new THREE.SphereGeometry(2+Math.random(),10,8),
new THREE.MeshStandardMaterial({color:0x3d6340,roughness:1})
);
leaves.position.set((Math.random()-.5)*2,4.5+i*.5,(Math.random()-.5)*2);
leaves.castShadow=true;
group.add(leaves);
}
group.position.set(x,0,z);
scene.add(group);
}

for(let i=0;i<12;i++){
makeTree((Math.random()-.5)*65,-28-Math.random()*30);
}

function createDuck(){
const duck=new THREE.Group();

const bodyMat=new THREE.MeshStandardMaterial({color:0x9b8155,roughness:.75});
const greenMat=new THREE.MeshStandardMaterial({color:0x145d42,roughness:.6});
const wingMat=new THREE.MeshStandardMaterial({color:0x806344,roughness:.8});
const beakMat=new THREE.MeshStandardMaterial({color:0xe3a33d});

const body=new THREE.Mesh(new THREE.SphereGeometry(.55,20,14),bodyMat);
body.scale.set(1.3,.7,.7);
duck.add(body);

const neck=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,.65,12),greenMat);
neck.position.set(.45,.45,0);
neck.rotation.z=-.35;
duck.add(neck);

const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),greenMat);
head.position.set(.58,.83,0);
duck.add(head);

const beak=new THREE.Mesh(new THREE.ConeGeometry(.13,.4,8),beakMat);
beak.rotation.z=-Math.PI/2;
beak.position.set(.91,.78,0);
duck.add(beak);

const wing=new THREE.Mesh(new THREE.SphereGeometry(.4,16,10),wingMat);
wing.scale.set(1,.2,.7);
wing.position.set(-.12,.22,0);
duck.add(wing);

const tail=new THREE.Mesh(new THREE.ConeGeometry(.17,.45,8),wingMat);
tail.rotation.z=Math.PI/2;
tail.position.set(-.68,.05,0);
duck.add(tail);

duck.userData={wing,baseY:3+Math.random()*6,phase:Math.random()*6,speed:5+Math.random()*4};
duck.scale.setScalar(.85+Math.random()*.35);
scene.add(duck);
return duck;
}

function spawnDuck(){
const duck=createDuck();
duck.position.set(Math.random()<.5?-25:25,duck.userData.baseY,-3-Math.random()*7);
duck.rotation.y=duck.position.x<0?0:Math.PI;
duck.userData.direction=duck.position.x<0?1:-1;
ducks.push(duck);
}

function updateDucks(delta){
for(let i=ducks.length-1;i>=0;i--){
const d=ducks[i];
d.position.x+=d.userData.direction*d.userData.speed*delta;
d.position.y=d.userData.baseY+Math.sin(clock.elapsedTime*3+d.userData.phase)*.5;
d.userData.wing.rotation.z=Math.sin(clock.elapsedTime*13+d.userData.phase)*.65;
d.rotation.z=Math.sin(clock.elapsedTime*2+d.userData.phase)*.08;
if(Math.abs(d.position.x)>35){
scene.remove(d);
ducks.splice(i,1);
}
}
}

function updateUI(){
document.querySelector('#score').textContent=score;
document.querySelector('#time').textContent=time;
document.querySelector('#round').textContent=round;
}

function startGame(){
score=0;time=60;round=1;playing=true;
ducks.forEach(d=>scene.remove(d));
ducks.length=0;
updateUI();
document.querySelector('#overlay').style.display='none';
for(let i=0;i<4;i++)spawnDuck();
clearInterval(timer);
timer=setInterval(()=>{
if(!playing)return;
time--;
if(time<=0)endGame();
updateUI();
},1000);
}

function endGame(){
playing=false;
clearInterval(timer);
document.querySelector('#overlay').style.display='flex';
document.querySelector('.panel h2').textContent='ROUND COMPLETE';
document.querySelector('.panel p').textContent='Final score: '+score;
document.querySelector('#start').textContent='PLAY AGAIN';
document.querySelector('#message').textContent='Great flying!';
}

document.querySelector('#start').addEventListener('click',()=>{
document.querySelector('.panel h2').textContent='DUCK HUNT ELITE';
document.querySelector('.panel p').textContent='Welcome to the marsh.';
document.querySelector('#message').textContent='Click START to begin';
startGame();
});

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

canvas.addEventListener('pointerdown',event=>{
if(!playing)return;
const rect=canvas.getBoundingClientRect();
pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
raycaster.setFromCamera(pointer,camera);
const hits=raycaster.intersectObjects(ducks,true);
if(hits.length){
let object=hits[0].object;
while(object.parent&&!ducks.includes(object))object=object.parent;
if(ducks.includes(object)){
scene.remove(object);
ducks.splice(ducks.indexOf(object),1);
score+=10;
if(score>=round*150)round++;
updateUI();
document.querySelector('#message').textContent='+10 POINTS';
spawnDuck();
}
}
});

function animate(){
requestAnimationFrame(animate);
const delta=Math.min(clock.getDelta(),.05);
if(playing){
updateDucks(delta);
if(ducks.length<5&&Math.random()<delta*.6)spawnDuck();
}
water.position.z=-5+Math.sin(clock.elapsedTime*.3)*.15;
renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/(innerHeight-66);
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight-66);
});
</script>
</body>
</html>
